name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ------------------------------------------------------------------ #
  # 1. Code Quality & Test Coverage — SonarQube                         #
  # ------------------------------------------------------------------ #
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for better SonarQube blame analysis

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov
        env:
          # HuggingFace downloads embeddings on import — point cache to CI tmp dir
          TRANSFORMERS_CACHE: /tmp/hf_cache
          HF_HOME: /tmp/hf_cache

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing || true
        env:
          # Provide dummy values so app.py imports don't fail during test collection
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
          TRANSFORMERS_CACHE: /tmp/hf_cache
          HF_HOME:            /tmp/hf_cache
        # '|| true' prevents failure if no tests exist yet — remove once tests are added

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ------------------------------------------------------------------ #
  # 2. Deploy to Railway (only on push to main, not on PRs)             #
  # ------------------------------------------------------------------ #
  deploy:
    name: Deploy → Railway
    runs-on: ubuntu-latest
    needs: sonarqube          # only deploy if quality scan passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

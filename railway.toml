[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Chainlit serves HTTP on / — use root path for healthcheck
# Increase timeout: HuggingFace model download on cold start takes ~60s
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
internalPort = 8080

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# FastAPI /health responds instantly — no Chainlit dependency
healthcheckPath = "/health"
# 120s: HuggingFace downloads BAAI/bge-small-en-v1.5 on first cold start
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
internalPort = 8080

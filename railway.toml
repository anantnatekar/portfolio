[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# /health is served by FastAPI in main.py — reliable, no Chainlit dependency
healthcheckPath = "/health"
# 120s start-period: HuggingFace model download on cold start takes ~60-90s
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
internalPort = 8080

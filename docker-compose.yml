version: "3.9"

services:
  portfolioai:
    image: ${ECR_IMAGE}   # set by deploy workflow: <account>.dkr.ecr.<region>.amazonaws.com/portfolioai:latest
    container_name: portfolioai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env            # lives on EC2 only — never committed to git
    volumes:
      - ./outputs:/app/outputs           # persist Excel reports between restarts
      - ./client_input:/app/client_input # mount private client files
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

version: "3.9"

# -----------------------------------------------------------------------
# LOCAL DEVELOPMENT ONLY
# For production, push to GitHub — Railway auto-deploys from main branch.
# -----------------------------------------------------------------------

services:
  portfolioai:
    build: .                    # builds from local Dockerfile
    container_name: portfolioai
    restart: unless-stopped
    ports:
      - "8080:8080"             # app runs on 8080 — matches Dockerfile and railway.toml
    environment:
      - PORT=8080
    env_file:
      - .env                    # copy .env.example → .env and fill in real values
    volumes:
      - ./outputs:/app/outputs           # persist Excel reports between restarts
      - ./client_input:/app/client_input # mount private client files
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT
# For production, push to GitHub — Railway auto-deploys from main branch.
# ─────────────────────────────────────────────────────────────────────────────

services:
  portfolioai:
    build: .
    container_name: portfolioai
    restart: unless-stopped
    ports:
      - "8080:8080"      # http://localhost:8080  → market dashboard
                         # http://localhost:8080/chat  → Chainlit agent UI
                         # http://localhost:8080/api/* → REST/SSE endpoints
    env_file:
      - .env             # copy .env.example → .env and fill in values
    volumes:
      - ./outputs:/app/outputs           # persist Excel reports
      - ./client_input:/app/client_input # private client files
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

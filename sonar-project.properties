sonar.projectKey=portfolioai
sonar.projectName=PortfolioAI
sonar.projectVersion=1.0

# Source — scan only app code, not generated or vendor files
sonar.sources=.
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  outputs/**,\
  client_input/**,\
  .venv/**,\
  venv/**,\
  hf_cache/**,\
  .cache/**,\
  .chainlit/**,\
  htmlcov/**,\
  dist/**,\
  build/**

# Test paths (update when tests are added)
sonar.tests=tests
sonar.test.inclusions=**/test_*.py,**/*_test.py

# Python
sonar.python.version=3.11

# Coverage report generated by pytest-cov (--cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml
